<!doctype html>
<meta charset="utf-8">
<title>cover</title>
<!--
  小红书封面模板 · 1080×1440 (3:4)
  由 scripts/render_cover.py 填充占位符后用无头浏览器截图。

  zine 系列风格参考 gc-minimal-zine-poster 的 style-system：
  纸纹负空间 + 单一高彩度锚色 + 安静的衬线/打字机字 + 印刷缺陷（网点、颗粒、套印偏移）。
  区别在于那套是 3:5 海报、留白 70–90%；小红书封面是 3:4 且要在信息流缩略图里读得清，
  所以 zine 把留白降到 55–70%、标题字号调到可读区间。zine-pure 才是忠实版。

  可以直接改这个文件再单独渲染：
      python render_cover.py --from-html cover.html --out cover.png
-->
<style>
  :root {
    --w: 1080px;
    --h: 1440px;

    --paper: __PAPER__;          /* 纸色 */
    --ink: __INK__;              /* 正文墨色，不用纯黑 */
    --ink-soft: __INK_SOFT__;    /* 微文字、装饰线 */
    --accent: __ACCENT__;        /* 唯一高彩度锚色 */
    --accent2: __ACCENT2__;      /* 套印偏移用的第二色，必须次要 */

    --title-size: __TITLE_SIZE__px;
    --title-track: __TITLE_TRACK__em;
    --title-leading: __TITLE_LEADING__;
    --caption-size: __CAPTION_SIZE__px;

    /* 单位由 Python 一起传进来 —— 不要在这里补 px，
       safe-y 是百分比，补了会变成 11%px 这种非法值，整条 inset 会被丢弃 */
    --safe-x: __SAFE_X__;
    --safe-y: __SAFE_Y__;

    --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC",
             "SimSun", "宋体", Georgia, serif;
    --mono: "SFMono-Regular", "Courier New", "Cascadia Mono", ui-monospace, monospace;
    --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .cover {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    isolation: isolate;
  }

  /* ---------- 纸：底色 + 纤维 + 边缘泛旧 ---------- */
  .paper-fiber {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(92deg, rgba(0,0,0,.014) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(2deg,  rgba(0,0,0,.010) 0 1px, transparent 1px 6px),
      radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(90,70,40,.075) 100%);
  }

  /* ---------- 颗粒：SVG 噪声，纯本地，不依赖外部图 ---------- */
  .grain {
    position: absolute; inset: -2%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='320' height='320' filter='url(%23g)'/></svg>");
    opacity: __GRAIN__;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* 扫描线，很轻，只有 scan 开启时有 */
  .scanline {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.030) 0 1px, transparent 1px 3px);
    opacity: __SCAN__;
    pointer-events: none;
  }

  /* ---------- 套准标记 ---------- */
  .regmark {
    position: absolute;
    width: 34px; height: 34px;
    opacity: __MARKS__;
    pointer-events: none;
  }
  .regmark::before, .regmark::after {
    content: ""; position: absolute; background: var(--ink-soft);
  }
  .regmark::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-.5px); }
  .regmark::after  { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-.5px); }
  .regmark i {
    position: absolute; inset: 9px;
    border: 1px solid var(--ink-soft); border-radius: 50%;
  }
  .rm-tl { left: 46px;  top: 46px; }
  .rm-br { right: 46px; bottom: 46px; }

  /* ---------- 主内容簇 ---------- */
  .content {
    position: absolute;
    inset: var(--safe-y) var(--safe-x);
    display: flex;
    flex-direction: column;
    justify-content: __JUSTIFY__;
    align-items: __ITEMS__;
    text-align: __ALIGN__;
  }
  .cluster { max-width: 100%; }

  /* ---------- 顶部标签：打字机小字，字距拉开 ---------- */
  .label {
    display: __LABEL_DISPLAY__;
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 400;
    letter-spacing: .30em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 20px;
    white-space: nowrap;
  }
  .label b {
    font-weight: 400;
    color: var(--accent);
  }

  /* ---------- 细分割线 ---------- */
  .rule {
    display: __RULE_DISPLAY__;
    width: 100%;
    height: 1px;
    background: var(--ink-soft);
    opacity: .5;
    margin-bottom: 30px;
  }
  .rule-dashed {
    display: __DASH_DISPLAY__;
    width: 100%;
    height: 1px;
    margin-bottom: 30px;
    background-image: repeating-linear-gradient(90deg, var(--ink-soft) 0 7px, transparent 7px 14px);
    opacity: .55;
  }

  /* ---------- 高彩度锚：小色块 ---------- */
  .anchor-block {
    display: __ANCHOR_DISPLAY__;
    position: relative;
    width: __ANCHOR_W__px;
    height: __ANCHOR_H__px;
    background: var(--accent);
    margin-bottom: 40px;
    clip-path: __ANCHOR_CLIP__;
  }
  /* 套印偏移：第二色错开 3px，riso 的味道就在这 */
  .anchor-block::after {
    content: "";
    position: absolute; inset: 0;
    background: var(--accent2);
    transform: translate(4px, 3px);
    mix-blend-mode: multiply;
    opacity: .5;
    clip-path: inherit;
    z-index: -1;
  }

  /* ---------- 照片窗口：不出血，压网点，去饱和 ---------- */
  .photo-window {
    display: __PHOTO_DISPLAY__;
    position: relative;
    width: 100%;
    height: __PHOTO_H__px;
    margin-bottom: 44px;
    overflow: hidden;
    transform: rotate(__PHOTO_ROT__deg);
  }
  .photo-window .img {
    position: absolute; inset: 0;
    background-image: __BG_URL__;
    background-size: cover;
    background-position: center;
    filter: grayscale(__PHOTO_GRAY__) contrast(1.06) brightness(1.04);
  }
  /* 网点 */
  .photo-window .halftone {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,.34) .9px, transparent 1.15px);
    background-size: 4px 4px;
    opacity: __HALFTONE__;
    mix-blend-mode: multiply;
  }
  /* 单色油墨叠加，让照片进入锚色体系 */
  .photo-window .ink {
    position: absolute; inset: 0;
    background: var(--accent);
    mix-blend-mode: multiply;
    opacity: __PHOTO_INK__;
  }

  /* ---------- 全幅淡背景（photo 旧样式用） ---------- */
  .bg-full {
    display: __BGFULL_DISPLAY__;
    position: absolute; inset: 0;
    background-image: __BG_URL__;
    background-size: cover;
    background-position: center;
  }
  .scrim {
    display: __BGFULL_DISPLAY__;
    position: absolute; inset: 0;
    background: __SCRIM__;
  }

  /* ---------- 标题 ---------- */
  .title {
    font-family: __TITLE_FONT__;
    font-size: var(--title-size);
    font-weight: __TITLE_WEIGHT__;
    line-height: var(--title-leading);
    letter-spacing: var(--title-track);
    color: var(--ink);
    __TITLE_SHADOW__
  }
  /* 标题里 [方括号] 包住的部分上锚色 */
  .title em {
    font-style: normal;
    color: var(--accent);
  }
  /* 色块里的标题 */
  .title-in-block .title { color: var(--paper); }

  /* ---------- 说明文字 ---------- */
  .caption {
    display: __CAPTION_DISPLAY__;
    font-family: var(--mono);
    font-size: var(--caption-size);
    line-height: 1.65;
    letter-spacing: .10em;
    color: var(--ink-soft);
    margin-top: 34px;
    __TITLE_SHADOW__
  }

  /* ---------- 边缘微文字：竖排在右侧，很 zine ---------- */
  .micro-side {
    display: __MICRO_DISPLAY__;
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    transform-origin: center;
    font-family: var(--mono);
    font-size: 20px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: .8;
    white-space: nowrap;
  }

  /* ---------- 底部署名 ---------- */
  .sig {
    display: __SIG_DISPLAY__;
    position: absolute;
    left: var(--safe-x);
    bottom: 54px;
    font-family: var(--mono);
    font-size: 21px;
    letter-spacing: .22em;
    color: var(--ink-soft);
    opacity: .75;
  }

  /* ---------- 点群装饰 ---------- */
  .dots {
    display: __DOTS_DISPLAY__;
    position: absolute;
    __DOTS_POS__
    width: 76px; height: 10px;
    background-image: radial-gradient(circle, var(--accent) 2.6px, transparent 3px);
    background-size: 19px 10px;
    opacity: .85;
  }
</style>

<div class="cover __STYLE__ __EXTRA_CLASS__">
  <div class="bg-full"></div>
  <div class="scrim"></div>
  <div class="paper-fiber"></div>

  <div class="regmark rm-tl"><i></i></div>
  <div class="regmark rm-br"><i></i></div>
  <div class="dots"></div>

  <div class="content">
    <div class="cluster">
      <div class="label">__LABEL_HTML__</div>
      <div class="photo-window">
        <div class="img"></div>
        <div class="ink"></div>
        <div class="halftone"></div>
      </div>
      <div class="anchor-block"></div>
      <div class="rule"></div>
      <div class="rule-dashed"></div>
      <div class="title">__TITLE_HTML__</div>
      <div class="caption">__CAPTION_HTML__</div>
    </div>
  </div>

  <div class="micro-side">__MICRO_HTML__</div>
  <div class="sig">__SIG_HTML__</div>

  <div class="scanline"></div>
  <div class="grain"></div>
</div>
